name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile and Package IPA
        run: |
          set -e
          SDK_PATH=$(xcrun --sdk iphoneos --show-sdk-path)

          mkdir -p AppBundle.app

          # 加上了 -parse-as-library 参数解决 @main 识别问题
          xcrun swiftc -target arm64-apple-ios15.0 \
            -sdk "$SDK_PATH" \
            -parse-as-library \
            ViewController.swift \
            -emit-executable \
            -o AppBundle.app/BaiyunGate

          cat << 'EOF' > AppBundle.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>BaiyunGate</string>
              <key>CFBundleIdentifier</key>
              <string>com.offline.baiyungate</string>
              <key>CFBundleName</key>
              <string>白云通门禁</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>NSBluetoothAlwaysUsageDescription</key>
              <string>用于连接门禁离线开门</string>
              <key>NSBluetoothPeripheralUsageDescription</key>
              <string>用于连接门禁离线开门</string>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
          </dict>
          </plist>
          EOF

          codesign --force --deep --sign - AppBundle.app

          mkdir -p Payload
          cp -r AppBundle.app Payload/
          zip -qry BaiyunGate.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: BaiyunGate-IPA
          path: BaiyunGate.ipa
          retention-days: 7
